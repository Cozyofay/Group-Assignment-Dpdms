# DPDMS web-ui - the Thymeleaf front end. It stores no data and enforces nothing itself.
server.port=${WEB_UI_PORT:8090}
spring.application.name=web-ui
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# The common security auto-configuration is for JWT APIs; this app uses a server-side session instead.
spring.autoconfigure.exclude=zw.ac.uz.dpdms.common.config.DpdmsSecurityAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Everything goes through the API gateway
dpdms.gateway-url=${GATEWAY_URL:http://localhost:8080}

# Session cookie hardening (SameSite blocks cross-site form posts)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

spring.thymeleaf.cache=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [${spring.application.name:}]
