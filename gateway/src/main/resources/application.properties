# DPDMS API Gateway - single entry point: http://localhost:8080
# (Flat .properties format: no indentation, so it cannot be broken by copy/paste.)

server.port=${GATEWAY_PORT:8080}
spring.application.name=gateway
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=60s

# ---------- API routes ----------
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.routes[1].id=flood-service
spring.cloud.gateway.routes[1].uri=lb://flood-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/floods/**

spring.cloud.gateway.routes[2].id=drought-service
spring.cloud.gateway.routes[2].uri=lb://drought-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/droughts/**

spring.cloud.gateway.routes[3].id=fire-service
spring.cloud.gateway.routes[3].uri=lb://fire-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/fires/**

spring.cloud.gateway.routes[4].id=zoonotic-disease-service
spring.cloud.gateway.routes[4].uri=lb://zoonotic-disease-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/zoonotic-diseases/**

spring.cloud.gateway.routes[5].id=mining-accident-service
spring.cloud.gateway.routes[5].uri=lb://mining-accident-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/mining-accidents/**

spring.cloud.gateway.routes[6].id=report-service
spring.cloud.gateway.routes[6].uri=lb://report-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reports/**
spring.cloud.gateway.routes[6].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[6].filters[0].args.name=reportService
spring.cloud.gateway.routes[6].filters[0].args.fallbackUri=forward:/fallback/report-service

spring.cloud.gateway.routes[7].id=alert-service
spring.cloud.gateway.routes[7].uri=lb://alert-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/alerts/**
spring.cloud.gateway.routes[7].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[7].filters[0].args.name=alertService
spring.cloud.gateway.routes[7].filters[0].args.fallbackUri=forward:/fallback/alert-service

spring.cloud.gateway.routes[8].id=dashboard-service
spring.cloud.gateway.routes[8].uri=lb://dashboard-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/dashboard/**
spring.cloud.gateway.routes[8].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[8].filters[0].args.name=dashboardService
spring.cloud.gateway.routes[8].filters[0].args.fallbackUri=forward:/fallback/dashboard-service

# ---------- OpenAPI docs of each service (for the combined Swagger UI) ----------
spring.cloud.gateway.routes[9].id=docs-auth-service
spring.cloud.gateway.routes[9].uri=lb://auth-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/docs/auth-service
spring.cloud.gateway.routes[9].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[10].id=docs-flood-service
spring.cloud.gateway.routes[10].uri=lb://flood-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/docs/flood-service
spring.cloud.gateway.routes[10].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[11].id=docs-drought-service
spring.cloud.gateway.routes[11].uri=lb://drought-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/docs/drought-service
spring.cloud.gateway.routes[11].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[12].id=docs-fire-service
spring.cloud.gateway.routes[12].uri=lb://fire-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/docs/fire-service
spring.cloud.gateway.routes[12].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[13].id=docs-zoonotic-disease-service
spring.cloud.gateway.routes[13].uri=lb://zoonotic-disease-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/docs/zoonotic-disease-service
spring.cloud.gateway.routes[13].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[14].id=docs-mining-accident-service
spring.cloud.gateway.routes[14].uri=lb://mining-accident-service
spring.cloud.gateway.routes[14].predicates[0]=Path=/docs/mining-accident-service
spring.cloud.gateway.routes[14].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[15].id=docs-report-service
spring.cloud.gateway.routes[15].uri=lb://report-service
spring.cloud.gateway.routes[15].predicates[0]=Path=/docs/report-service
spring.cloud.gateway.routes[15].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[16].id=docs-alert-service
spring.cloud.gateway.routes[16].uri=lb://alert-service
spring.cloud.gateway.routes[16].predicates[0]=Path=/docs/alert-service
spring.cloud.gateway.routes[16].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.routes[17].id=docs-dashboard-service
spring.cloud.gateway.routes[17].uri=lb://dashboard-service
spring.cloud.gateway.routes[17].predicates[0]=Path=/docs/dashboard-service
spring.cloud.gateway.routes[17].filters[0]=SetPath=/v3/api-docs

# ---------- Combined Swagger UI: http://localhost:8080/swagger-ui.html ----------
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=auth-service
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/docs/auth-service
springdoc.swagger-ui.urls[1].name=flood-service
springdoc.swagger-ui.urls[1].url=/docs/flood-service
springdoc.swagger-ui.urls[2].name=drought-service
springdoc.swagger-ui.urls[2].url=/docs/drought-service
springdoc.swagger-ui.urls[3].name=fire-service
springdoc.swagger-ui.urls[3].url=/docs/fire-service
springdoc.swagger-ui.urls[4].name=zoonotic-disease-service
springdoc.swagger-ui.urls[4].url=/docs/zoonotic-disease-service
springdoc.swagger-ui.urls[5].name=mining-accident-service
springdoc.swagger-ui.urls[5].url=/docs/mining-accident-service
springdoc.swagger-ui.urls[6].name=report-service
springdoc.swagger-ui.urls[6].url=/docs/report-service
springdoc.swagger-ui.urls[7].name=alert-service
springdoc.swagger-ui.urls[7].url=/docs/alert-service
springdoc.swagger-ui.urls[8].name=dashboard-service
springdoc.swagger-ui.urls[8].url=/docs/dashboard-service

# ---------- Circuit breaker (graceful degradation) ----------
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=20s
# report generation can take a while; the default 1s timeout is too short
resilience4j.timelimiter.configs.default.timeout-duration=60s

# ---------- Service discovery ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# ---------- Observability ----------
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.gateway.enabled=true
logging.pattern.level=%5p [${spring.application.name:}]
