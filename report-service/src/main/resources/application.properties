# DPDMS report-service - reusable PDF / DOCX / XLSX / CSV reporting. It owns no database.
server.port=${REPORT_PORT:8088}
spring.application.name=report-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- security ----------
dpdms.gateway-url=${GATEWAY_URL:http://localhost:8080}
dpdms.security.jwt-secret=${JWT_SECRET:}
dpdms.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
dpdms.security.internal-api-key=${INTERNAL_API_KEY:}

# ---------- discovery and observability ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
