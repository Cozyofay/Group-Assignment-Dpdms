# DPDMS flood-service - one of the five hazard micro-services
server.port=${FLOOD_PORT:8082}
spring.application.name=flood-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- its own database ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/dpdms_flood?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Harare
spring.datasource.username=${DB_USERNAME:dpdms}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- messaging (alerts) ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
dpdms.alerts.enabled=${ALERTS_ENABLED:true}

# ---------- security: this service manages FLOOD records only ----------
dpdms.gateway-url=${GATEWAY_URL:http://localhost:8080}
dpdms.security.jwt-secret=${JWT_SECRET:}
dpdms.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
dpdms.security.internal-api-key=${INTERNAL_API_KEY:}
dpdms.security.service-hazard=FLOOD

# ---------- discovery and observability ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
