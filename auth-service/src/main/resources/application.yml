server:
  port: ${AUTH_PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/dpdms_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Harare
    username: ${DB_USERNAME:dpdms}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none          # the schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
  flyway:
    enabled: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

dpdms:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    internal-api-key: ${INTERNAL_API_KEY:}
    public-paths:
      - /api/auth/login
    read-only-exempt-paths:
      - /api/auth/change-password
  seed:
    enabled: true
    default-password: ${SEED_DEFAULT_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
