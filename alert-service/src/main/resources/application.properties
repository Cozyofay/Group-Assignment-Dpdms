# DPDMS alert-service - email and WhatsApp dispatch, driven by RabbitMQ
server.port=${ALERT_PORT:8087}
spring.application.name=alert-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- its own database (the alert log) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/dpdms_alert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Harare
spring.datasource.username=${DB_USERNAME:dpdms}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- RabbitMQ: retry a few times, then dead-letter ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- email (Mailpit by default: http://localhost:8025) ----------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
dpdms.alerts.mail.enabled=${MAIL_ENABLED:true}
dpdms.alerts.mail.from=${MAIL_FROM:alerts@dpdms.local}

# ---------- WhatsApp Business Cloud API ----------
dpdms.alerts.whatsapp.enabled=${WHATSAPP_ENABLED:false}
dpdms.alerts.whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v21.0}
dpdms.alerts.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
dpdms.alerts.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# ---------- security ----------
dpdms.gateway-url=${GATEWAY_URL:http://localhost:8080}
dpdms.security.jwt-secret=${JWT_SECRET:}
dpdms.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
dpdms.security.internal-api-key=${INTERNAL_API_KEY:}

# ---------- discovery and observability ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics
logging.pattern.level=%5p [${spring.application.name:},%X{correlationId:-}]
