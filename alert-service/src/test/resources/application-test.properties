spring.datasource.url=jdbc:h2:mem:alertdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
eureka.client.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
dpdms.security.jwt-secret=test-secret-that-is-definitely-longer-than-32-bytes
dpdms.security.internal-api-key=test-internal-key
dpdms.alerts.mail.enabled=false
dpdms.alerts.whatsapp.enabled=false
